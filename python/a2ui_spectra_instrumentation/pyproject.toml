[project]
name = "a2ui-spectra-instrumentation"
version = "0.1.0"
description = "OpenTelemetry instrumentation of the A2UI agent SDK, reporting the A2UI step to Spectra"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["a2ui", "opentelemetry", "instrumentation", "spectra"]
dependencies = [
  "opentelemetry-api>=1.39.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39.0,<2",
  "opentelemetry-instrumentation>=0.60b0",
  "opentelemetry-sdk>=1.39.0,<2",
  "wrapt>=1.16.0,<3",
]

[project.urls]
Repository = "https://github.com/retz8/a2ui-spectra"
Issues = "https://github.com/retz8/a2ui-spectra/issues"

[project.optional-dependencies]
instruments = ["a2ui-agent-sdk >= 0.11.0"]

[project.entry-points.opentelemetry_instrumentor]
a2ui = "a2ui_spectra_instrumentation:A2uiInstrumentor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2ui_spectra_instrumentation"]

[tool.hatch.build.targets.sdist]
include = ["/src"]
