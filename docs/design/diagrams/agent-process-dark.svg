      <style>#agent-process-dark-root { --color-paper: #0e0f11;
  --color-ink: #ecedef;
  --color-muted: #aeb2b9;
  --font-sans: 'Inter', 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      #agent-process-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-process-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#agent-process-dark-root .diagram-container { overflow-x: visible; }
}</style>
