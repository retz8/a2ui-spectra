<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-process-dark-title agent-process-dark-desc" id="agent-process-dark-root">
<title id="agent-process-dark-title">The agent’s process under run</title>
<desc id="agent-process-dark-desc">Spectra starts the agent’s command in a process group of its own, restarts it when a watched file is saved or Restart is pressed in the viewer, stops the whole group on Ctrl-C, reads the agent’s card at each start, and keeps the group’s output for the viewer’s logs.</desc>
