<title>The preview · Architecture</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --color-paper: #eff0f3;
  --color-ink: #16171a;
  --color-muted: #55595f;
  --font-sans: 'Inter', 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
}
body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
.frame { max-width: 1200px; width: 100%; }
.diagram-container { width: 100%; overflow-x: auto; }
.eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
h1 { font-family: var(--font-sans); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
svg { width: 100%; min-width: 960px; display: block; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>

<div class="frame">
<p class="eyebrow">Architecture · Spectra for A2UI</p>
<h1>The preview, between the viewer and its pages</h1>

<title id="preview-title">The preview, between the viewer and its pages</title>
<desc id="preview-desc">The turn view sends the surface's messages to the first preview page that claims its catalog, your own page before the built-in one; the page draws it with the catalog's own renderer and sends back what went wrong and the action a press makes, which the composer sends to the agent as the next turn.</desc>
