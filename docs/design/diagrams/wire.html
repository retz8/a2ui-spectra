:root {

<div class="frame">
<p class="eyebrow">Architecture · Spectra for A2UI</p>
<h1>The wire proxy, between a host and the agent</h1>
<div class="diagram-container">
<svg viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wire-title wire-desc">
<title id="wire-title">The wire proxy, between a host and the agent</title>
<desc id="wire-desc">A host, Spectra's message box or the developer's own, sends its A2A request to the wire proxy, which forwards it to the agent with a traceparent added and passes the reply back as received; each send or stream is one turn, written as wire events, then checked, stored and shown once the reply ends.</desc>
