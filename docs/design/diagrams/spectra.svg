<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spectra-title spectra-desc" id="spectra-root">
<title id="spectra-title">Spectra at the edges of an agent</title>
<desc id="spectra-desc">Spectra runs as one local process with four taps at the edges every agent stack has: the wire proxy between the host and the agent, the model proxy and the tool proxy on the agent's outgoing calls, and the OpenTelemetry receiver for its spans; each feeds the viewer in the browser.</desc>
<defs>
      <style>#spectra-root { --color-paper: #eff0f3;
  --color-ink: #16171a;
  --color-muted: #55595f;
  --font-sans: 'Inter', 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      #spectra-root { font-family: var(--font-sans); color: var(--color-ink); }
      #spectra-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#spectra-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="spectra-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55595f"/></marker>
<marker id="spectra-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00796b"/></marker>
</defs>
