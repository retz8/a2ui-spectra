<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a2ui-step-title a2ui-step-desc" id="a2ui-step-root">
<title id="a2ui-step-title">The A2UI step, reported to Spectra</title>
<desc id="a2ui-step-desc">Inside the agent, the wrapper hooks the agent SDK's prompt generator and parser and exports a prompt generation span and a parse span to Spectra's receiver, which places them in the turn the viewer shows; a failed parse makes the agent ask the model again.</desc>
<defs>
      <style>#a2ui-step-root { --color-paper: #eff0f3;
  --color-ink: #16171a;
  --color-muted: #55595f;
  --font-sans: 'Inter', 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      #a2ui-step-root { font-family: var(--font-sans); color: var(--color-ink); }
      #a2ui-step-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#a2ui-step-root .diagram-container { overflow-x: visible; }
}</style>
