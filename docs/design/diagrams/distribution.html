<p class="eyebrow">Architecture · Spectra for A2UI</p>
<h1>How the binary is released and installed</h1>
<div class="diagram-container">
<svg viewBox="0 0 960 596" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="distribution-title distribution-desc">
<title id="distribution-title">How the binary is released and installed</title>
<desc id="distribution-desc">The release workflow builds the five binaries once, packs them, publishes them into stand-in registries first and runs the install check on the five platforms; once it has passed, the same files are published to npm, PyPI and a GitHub release. An install through npx, uvx or the install script leaves no download mark, and a binary downloaded by hand is checked against its checksum and attestation and its mark cleared.</desc>
