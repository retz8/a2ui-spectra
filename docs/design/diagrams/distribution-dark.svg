  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      #distribution-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #distribution-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#distribution-dark-root .diagram-container { overflow-x: visible; }
}</style>
