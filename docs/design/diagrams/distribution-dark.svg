<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 596" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="distribution-dark-title distribution-dark-desc" id="distribution-dark-root">
<title id="distribution-dark-title">How the binary is released and installed</title>
<desc id="distribution-dark-desc">The release workflow builds the five binaries once, packs them, publishes them into stand-in registries first and runs the install check on the five platforms; once it has passed, the same files are published to npm, PyPI and a GitHub release. An install through npx, uvx or the install script leaves no download mark, and a binary downloaded by hand is checked against its checksum and attestation and its mark cleared.</desc>
