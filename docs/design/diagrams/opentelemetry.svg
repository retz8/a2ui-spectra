<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="opentelemetry-title opentelemetry-desc" id="opentelemetry-root">
<title id="opentelemetry-title">The agent’s spans, placed in their turn</title>
<desc id="opentelemetry-desc">The wire proxy's trace context enters the agent's span tree at its server span and leaves on its model calls; every span and log record is exported to Spectra's receiver, which reads each in its producer's dialect, places it in its turn and links a call's spans to the proxy's exchange of the same call.</desc>
