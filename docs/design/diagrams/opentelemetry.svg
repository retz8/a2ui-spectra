      <style>#opentelemetry-root { --color-paper: #eff0f3;
  --color-ink: #16171a;
  --color-muted: #55595f;
  --font-sans: 'Inter', 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      #opentelemetry-root { font-family: var(--font-sans); color: var(--color-ink); }
      #opentelemetry-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#opentelemetry-root .diagram-container { overflow-x: visible; }
}</style>
