<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="replay-and-fixtures-title replay-and-fixtures-desc" id="replay-and-fixtures-root">
<title id="replay-and-fixtures-title">A replay, driven and answered from one record</title>
<desc id="replay-and-fixtures-desc">Spectra reads one turn record: its message box re-sends the recorded wire inputs through the wire proxy to the agent and judges each closed turn, while the model proxy and the tool proxy, armed with a pool of the recorded calls, answer the agent's calls from it; only with the model live does a model request the record misses go to the provider.</desc>
<defs>
      <style>#replay-and-fixtures-root { --color-paper: #eff0f3;
  --color-ink: #16171a;
  --color-muted: #55595f;
  --font-sans: 'Inter', 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      #replay-and-fixtures-root { font-family: var(--font-sans); color: var(--color-ink); }
      #replay-and-fixtures-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#replay-and-fixtures-root .diagram-container { overflow-x: visible; }
}</style>
