<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="checks-title checks-desc" id="checks-root">
<title id="checks-title">The four checks at a turn’s close</title>
<desc id="checks-desc">At a turn’s close each of the agent’s A2UI messages is checked against its protocol version’s schema, and the conversation, fed in order through upstream web core with the catalog registry’s catalogs, gives the catalog, structural and binding checks their surfaces; the four results are written into the turn record as check events.</desc>
<defs>
      <style>#checks-root { --color-paper: #eff0f3;
  --color-ink: #16171a;
  --color-muted: #55595f;
  --font-sans: 'Inter', 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      #checks-root { font-family: var(--font-sans); color: var(--color-ink); }
      #checks-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#checks-root .diagram-container { overflow-x: visible; }
}</style>
