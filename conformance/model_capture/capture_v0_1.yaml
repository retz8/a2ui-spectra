# The model capture path: each recording of model API traffic replayed through
# the model proxy, with the stand-in provider in the provider's place, and the
# model call events it writes compared with the expected record.

- name: openai_chat_reference_examples
  description: "OpenAI's Chat Completions API, in the shapes of its API reference: a completion not streamed, one streamed with its usage in the last chunk, a tool call and the request carrying its result, a usage reporting cached_tokens, an unknown model's 404, and an error object inside a 2xx stream."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/openai_chat/reference_examples.har"
  expect: "test_data/model_capture/v0_1/openai_chat/reference_examples.json"

- name: openai_responses_reference_examples
  description: "OpenAI's Responses API, in the shapes of its API reference: a response not streamed, one streamed to response.completed, a function call and the request carrying its output, a usage reporting cached_tokens, an unknown model's 404, and a stream ending in response.failed."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/openai_responses/reference_examples.har"
  expect: "test_data/model_capture/v0_1/openai_responses/reference_examples.json"

- name: anthropic_overloaded_stream
  description: "Anthropic's Messages API: a 2xx stream carrying an error event, overloaded_error, in the shape of Anthropic's streaming documentation; a failed call with the chunks before the error."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/anthropic/overloaded_stream.har"
  expect: "test_data/model_capture/v0_1/anthropic/overloaded_stream.json"

- name: gemini_rate_limited
  description: "Gemini's generateContent answering 429 in Gemini's documented error shape: a failed call with the provider's message as the status message."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/gemini/rate_limited.har"
  expect: "test_data/model_capture/v0_1/gemini/rate_limited.json"

- name: gemini_restaurant_finder_google_genai
  description: "Upstream's Python restaurant finder on Gemini through google-genai, under ADK: a two-turn conversation of three streamed generateContent calls, the first a get_restaurants tool call and the second carrying its result, the third the booking form; the key in x-goog-api-key removed."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/gemini/restaurant_finder_google_genai.har"
  expect: "test_data/model_capture/v0_1/gemini/restaurant_finder_google_genai.json"

- name: gemini_custom_components_litellm
  description: "Upstream's custom-components example on Gemini through LiteLLM's gemini/ route, under ADK: one turn of three streamed generateContent calls under the version LiteLLM's custom base leaves out, the first a get_contact_info tool call and the second carrying its result; the key in x-goog-api-key removed."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/gemini/custom_components_litellm.har"
  expect: "test_data/model_capture/v0_1/gemini/custom_components_litellm.json"

- name: anthropic_custom_components_litellm
  description: "Upstream's custom-components example on Claude through LiteLLM's anthropic/ route, under ADK: one turn of three streamed Messages calls, the first a get_contact_info tool call and the second carrying its result; the key in x-api-key removed."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/anthropic/custom_components_litellm.har"
  expect: "test_data/model_capture/v0_1/anthropic/custom_components_litellm.json"

- name: anthropic_cache_write_then_read
  description: "Anthropic's Messages API, scripted: two calls with cache_control on the same long system prompt, the first writing the cache and the second reading it, each with its thinking tokens."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/anthropic/cache_write_then_read.har"
  expect: "test_data/model_capture/v0_1/anthropic/cache_write_then_read.json"

- name: anthropic_unknown_model
  description: "Anthropic's Messages API, scripted: an unknown model's 404, a failed call with the provider's message."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/anthropic/unknown_model.har"
  expect: "test_data/model_capture/v0_1/anthropic/unknown_model.json"

- name: gemini_unknown_model_and_count_tokens
  description: "Gemini, scripted: an unknown model's 404 on generateContent, a failed call with the provider's message, then countTokens, another request on the provider's host, recorded raw."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/gemini/unknown_model_and_count_tokens.har"
  expect: "test_data/model_capture/v0_1/gemini/unknown_model_and_count_tokens.json"

- name: gemini_rate_limited_on_another_host
  description: "The same 429 at an origin the test-only variable does not name: a call recorded raw, with the exchange only and no message from the body."
  action: capture_model
  traffic: "test_data/model_capture/v0_1/gemini/rate_limited.har"
  expect: "test_data/model_capture/v0_1/gemini/rate_limited_raw.json"
  readInFull: false
