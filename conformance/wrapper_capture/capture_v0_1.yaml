- name: direct_json_generate
  description: "Direct JSON's prompt generated on the basic catalog at v1.0."
  action: capture_wrapper
  job: "test_data/wrapper_capture/v0_1/direct_json_generate/input.json"
  expect:
    python: "test_data/wrapper_capture/v0_1/direct_json_generate/expected_python.json"
