name: Setup Node.js
description: Configures Corepack, Node.js, and Yarn with dependency caching
inputs:
  node-version:
    description: Target Node.js version
    default: "22"
  install:
    description: "Whether to run yarn install"
    default: "true"
  cache:
    description: "Whether to enable Yarn caching (defaults to true when install is true)"
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      if: ${{ (inputs.cache == 'true' || inputs.cache == true) || ((inputs.cache == '' || inputs.cache == null) && (inputs.install == 'true' || inputs.install == true)) }}
      with:
        node-version: ${{ inputs.node-version }}
        cache: "yarn"
    - name: Install dependencies
      if: ${{ inputs.install == 'true' || inputs.install == true }}
      run: yarn install --immutable
      shell: bash
