name: Publish to PyPI
description: The release's seven PyPI files, each uploaded unless the index already holds it with the same checksum
inputs:
  index:
    description: The index's simple index, which the already-there check reads
    required: true
  repository-url:
    description: The address the files are uploaded to; PyPI's when empty
    default: ""
  user:
    description: The user; `__token__` with no password is trusted publishing
    default: __token__
  password:
    description: The password, for a stand-in
    default: ""
  attestations:
    description: Upload PyPI's attestations with the files
    default: "true"
  files:
    description: The folder holding the seven files
    required: true
  expect-all-there:
    description: Fail on a file the index does not hold, instead of uploading it
    default: "false"
runs:
  using: composite
  steps:
    - name: The PyPI files not there yet
      id: plan
      shell: bash
      # The upload folder is in the workspace, which the publishing action's container mounts.
      run: node "$GITHUB_WORKSPACE/tools/spectra/scripts/release.mjs" pypi --index "$INDEX" --files "$FILES" --upload release-upload/pypi $EXPECT
      env:
        INDEX: ${{ inputs.index }}
        FILES: ${{ inputs.files }}
        EXPECT: ${{ inputs.expect-all-there == 'true' && '--expect-all-there' || '' }}
    - name: Upload them
      if: steps.plan.outputs.upload == 'true'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: ${{ inputs.repository-url }}
        user: ${{ inputs.user }}
        password: ${{ inputs.password }}
        packages-dir: release-upload/pypi/
        attestations: ${{ inputs.attestations }}
