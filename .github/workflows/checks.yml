name: Everything CI runs

# CI and the release workflow both run this, so that a release runs everything CI runs, on the
# commit it was dispatched on. Under `release-files`, the release workflow's, the binary's
# packages and the libraries' packs are uploaded to the run, the files its publishing jobs publish.

on:
  workflow_call:
    inputs:
      release-files:
        description: Upload the binary's packages and the libraries' packs to the run
        type: boolean
        default: false
      refuse-local-patches:
        description: Fail when an npm package bundled into the binary resolves to a local patch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
      - name: Version check
        run: yarn workspace a2ui-spectra check:version
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync the Python workspace
        run: uv sync --all-packages --locked
      - name: Setup Wireit Cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4
      - name: Build
        run: yarn build:all
      - name: Lint
        run: yarn lint:all
      - name: Format check
        run: yarn format:check:all
      - name: Link check
        run: node scripts/check_links.mjs
      - name: Python format check
        run: uv run pyink --check .
      - name: Python type check
        run: uv run mypy
      - name: Python tests
        run: uv run pytest
      - name: Pack the libraries
        run: yarn workspace a2ui-spectra pack:libraries
      - name: Check the libraries' packs, and install them
        run: yarn workspace a2ui-spectra check:libraries
      - name: Install Playwright's Chromium
        run: npx playwright@1.58.1 install --with-deps chromium chromium-headless-shell
      - name: Test
        run: yarn test:all
      # The packs the tests ran beside, for the release workflow's publishing jobs.
      - if: inputs.release-files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-libraries
          path: tools/spectra/dist/libraries/npm/*.tgz
          if-no-files-found: error
      - if: inputs.release-files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-libraries
          path: tools/spectra/dist/libraries/pypi/*
          if-no-files-found: error

  # The floor end of the wrappers' OpenTelemetry ranges: each wrapper's own tests and the wrapper
  # capture suite, with OpenTelemetry and wrapt held at the floors the two manifests state. The
  # other jobs run on the lockfiles, the latest end.
  wrapper-floors:
    name: The wrappers' floor run
    runs-on: ubuntu-24.04
    env:
      # uv takes the lowest version each manifest admits: the Python wrapper's floors.
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
        with:
          install: false
          cache: true
      - name: Hold the TypeScript wrapper's floors
        run: node scripts/wrapper_floors.mjs hold
      - name: Install at the floors
        run: yarn install --no-immutable
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync the Python workspace at the floors
        run: uv sync --all-packages
      - name: Check that each floor is what is installed
        run: node scripts/wrapper_floors.mjs check
      - name: Setup Wireit Cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4
      - name: The Python wrapper's tests
        run: uv run pytest
      - name: The TypeScript wrapper's tests
        run: yarn workspace a2ui-spectra-instrumentation test
        env:
          # Wireit's fingerprint leaves out yarn.lock and the root's resolutions, which hold the
          # floors, so a cached result says nothing of this install: the tests run.
          WIREIT_CACHE: none
      - name: The wrapper capture suite
        run: yarn workspace a2ui-spectra test
        env:
          SPECTRA_TEST_PART: wrapper-capture
          WIREIT_CACHE: none

  binaries:
    uses: $/.github/workflows/binaries.yml
    with:
      release-files: ${{ inputs.release-files }}
      refuse-local-patches: ${{ inputs.refuse-local-patches }}

  binary-test:
    name: The binary test run (${{ matrix.platform }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        # The macOS x64 runner, the slowest, runs the tool's test target as three parts, on three runners.
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-15-intel
            part: wrapper-capture
          - platform: darwin-x64
            runner: macos-15-intel
            part: command-line
          - platform: darwin-x64
            runner: macos-15-intel
            part: others
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync the Python workspace
        run: uv sync --all-packages --locked
      - name: Setup Wireit Cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4
      - name: Build
        run: yarn build:all
      - name: Install Playwright's Chromium
        run: npx playwright@1.58.1 install --with-deps chromium chromium-headless-shell
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a2ui-spectra-${{ matrix.platform }}
          path: ${{ runner.temp }}/binary
      - name: Make the binary executable
        run: chmod +x "$RUNNER_TEMP/binary/a2ui-spectra-${{ matrix.platform }}"
      - name: Test against the binary
        run: yarn workspace a2ui-spectra test
        env:
          SPECTRA_BINARY: ${{ runner.temp }}/binary/a2ui-spectra-${{ matrix.platform }}
          SPECTRA_TEST_PART: ${{ matrix.part }}
          # The build comes from the cache; the tests run against this run's binary.
          WIREIT_CACHE: none

  windows:
    needs: binaries
    uses: $/.github/workflows/windows_binary_test.yml
