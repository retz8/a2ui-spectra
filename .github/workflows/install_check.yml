name: The install check

# An adopter's install of the binary on the five platforms, each command as the root README's
# install section writes it: npx under Node 22 and under the newest LTS line, uvx with uv at its
# latest, and the install script, on Windows under both PowerShells. Called by the release
# workflow, from the stores its publishing steps left in the stand-ins, and after a real publish
# against npm, PyPI and GitHub themselves; started by hand, against the real registries. Each
# install is `tools/spectra/scripts/install_check.mjs`; the workspace is on the runner for the
# stub agent and that script alone. CI does not run it.

on:
  workflow_call:
    inputs:
      stand-ins:
        description: From the stores the run's publishing steps left in the stand-ins
        type: boolean
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: The install check (${{ matrix.platform }}, ${{ inputs.stand-ins && 'stand-ins' || 'registries' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      FROM: ${{ inputs.stand-ins && 'stand-ins' || 'registries' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Build the stub agent
        run: yarn workspace a2ui-spectra-conformance build
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: latest
      - if: inputs.stand-ins
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stand-in-stores
          path: ${{ runner.temp }}/stand-ins
      - if: inputs.stand-ins
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release
          path: ${{ runner.temp }}/github-release
      - if: inputs.stand-ins
        name: The stand-ins, on the run's stores
        run: node tools/spectra/scripts/stand_ins.mjs serve "${{ runner.temp }}/stand-ins"
      - name: npx, under Node 22
        run: node tools/spectra/scripts/install_check.mjs npx --from ${{ env.FROM }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          check-latest: true
      - name: npx, under the newest LTS line
        run: node tools/spectra/scripts/install_check.mjs npx --from ${{ env.FROM }}
      - name: uvx
        run: node tools/spectra/scripts/install_check.mjs uvx --from ${{ env.FROM }}
      - if: runner.os != 'Windows'
        name: The install script
        run: node tools/spectra/scripts/install_check.mjs script --from ${{ env.FROM }} ${{ inputs.stand-ins && format('--github-files "{0}/github-release"', runner.temp) || '' }}
      - if: runner.os == 'Windows'
        name: The install script, under powershell.exe
        run: node tools/spectra/scripts/install_check.mjs script --shell powershell.exe --from ${{ env.FROM }} ${{ inputs.stand-ins && format('--github-files "{0}/github-release"', runner.temp) || '' }}
      - if: runner.os == 'Windows'
        name: The install script, under pwsh.exe
        run: node tools/spectra/scripts/install_check.mjs script --shell pwsh.exe --from ${{ env.FROM }} ${{ inputs.stand-ins && format('--github-files "{0}/github-release"', runner.temp) || '' }}
      - if: always() && inputs.stand-ins
        name: Stop the stand-ins
        run: node tools/spectra/scripts/stand_ins.mjs stop "${{ runner.temp }}/stand-ins"
