name: Release

# A release of every package at the committed version, started by hand: everything CI runs; the
# publishing steps into stand-in registries on their runner, whose stores are uploaded to the run;
# and the install check on the five platforms from those stores, `install_check.yml`. A dry run
# ends there and touches nothing on GitHub. A real run, from main, goes on once the install check
# has passed: the draft release with its attestation, PyPI and npm through trusted publishing, the
# draft published, which makes the tag, and the install check again, against npm, PyPI and GitHub
# themselves. Some steps around it are done by hand; the trusted
# publishers on npm and PyPI name this file and the `release` environment. The PyPI publishing
# action is called from each job itself: called from inside another action, it does not find its
# own container image. Its upload folder is in the workspace, which its container mounts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The committed version, as a confirmation
        required: true
        type: string
      dry-run:
        description: A dry run, into stand-in registries
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# No job of the run restores or saves a cache, those of the workflows it calls included: what the
# run publishes is built from the commit and the registries alone.
cache-mode: none

env:
  VERSION: ${{ inputs.version }}

jobs:
  first-step:
    name: The first step
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, for the preview protocol of the release before.
          fetch-depth: 0
      - uses: $/.github/actions/setup-node
        with:
          install: false
      - name: The version, the ref, the changelog's section, and the tag and the release
        run: node tools/spectra/scripts/release.mjs first-step --version "$VERSION" --ref "$GITHUB_REF" --notes "$RUNNER_TEMP/release-notes.md" $DRY_RUN
        env:
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/release-notes.md
          archive: false
          if-no-files-found: error

  checks:
    needs: first-step
    uses: $/.github/workflows/checks.yml
    with:
      release-files: true
      refuse-local-patches: ${{ !inputs.dry-run }}

  # The publishing steps, into stand-ins, with no permission beyond reading, on both runs.
  stand-ins:
    name: The publishing steps, into stand-ins
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
        with:
          install: false
      - name: npm 11.21.1, for trusted publishing
        run: npm install --global npm@11.21.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-*
          merge-multiple: true
          path: release-files/npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi-*
          merge-multiple: true
          path: release-files/pypi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release
          path: release-files/github
      - name: The release's files
        run: ls -l release-files/*
      - name: Start the stand-ins
        run: node tools/spectra/scripts/stand_ins.mjs start "$RUNNER_TEMP/stand-ins"
      - name: The placeholders, first
        run: |
          node tools/spectra/scripts/placeholders.mjs
          node tools/spectra/scripts/release.mjs npm --placeholders --registry "$A2UI_SPECTRA_STAND_IN_NPM" --files tools/spectra/dist/placeholders
      - name: PyPI, the files not there yet
        id: pypi
        run: node tools/spectra/scripts/release.mjs pypi --index "$A2UI_SPECTRA_STAND_IN_PYPI_INDEX" --files release-files/pypi --upload release-upload/pypi
      - name: PyPI, their upload
        if: steps.pypi.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ env.A2UI_SPECTRA_STAND_IN_PYPI_UPLOAD }}
          user: dry-run
          password: dry-run
          attestations: false
          packages-dir: release-upload/pypi/
      - name: npm
        uses: $/.github/actions/publish-npm
        with:
          registry: ${{ env.A2UI_SPECTRA_STAND_IN_NPM }}
          files: release-files/npm
      - name: PyPI again, every file already there, the files not there yet
        id: pypi-again
        run: node tools/spectra/scripts/release.mjs pypi --index "$A2UI_SPECTRA_STAND_IN_PYPI_INDEX" --files release-files/pypi --upload release-upload/pypi --expect-all-there
      - name: PyPI again, every file already there, their upload
        if: steps.pypi-again.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ env.A2UI_SPECTRA_STAND_IN_PYPI_UPLOAD }}
          user: dry-run
          password: dry-run
          attestations: false
          packages-dir: release-upload/pypi/
      - name: npm again, every package already there
        uses: $/.github/actions/publish-npm
        with:
          registry: ${{ env.A2UI_SPECTRA_STAND_IN_NPM }}
          files: release-files/npm
          expect-all-there: true
      - name: What the stand-ins hold, and in which order
        run: >-
          node tools/spectra/scripts/release.mjs stand-ins
          --npm-registry "$A2UI_SPECTRA_STAND_IN_NPM" --npm-files release-files/npm
          --pypi-index "$A2UI_SPECTRA_STAND_IN_PYPI_INDEX" --pypi-files release-files/pypi
      - name: Stop the stand-ins
        run: node tools/spectra/scripts/stand_ins.mjs stop "$RUNNER_TEMP/stand-ins"
      # Their stores, for the install check. A job run again replaces them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stand-in-stores
          path: |
            ${{ runner.temp }}/stand-ins/npm/storage
            ${{ runner.temp }}/stand-ins/pypi/packages
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error

  # The install check, from the stores the publishing steps left, on both runs.
  install-check:
    name: The install check, from the stand-ins
    needs: stand-ins
    uses: $/.github/workflows/install_check.yml
    with:
      stand-ins: true

  # A real run, from main, once the install check has passed. The jobs that hold the release's
  # permissions download the run's files and publish them, and do nothing else.
  draft:
    name: The draft release, and its attestation
    if: ${{ !inputs.dry-run }}
    needs: install-check
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
        with:
          install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release
          path: release-files/github
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes.md
          path: ${{ runner.temp }}
      - name: The draft, holding the five archives and checksums.txt
        run: node tools/spectra/scripts/release.mjs draft --tag "v$VERSION" --target "$GITHUB_SHA" --files release-files/github --notes "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: The attestation of the five archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-files/github/checksums.txt

  pypi:
    name: PyPI
    needs: draft
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
        with:
          install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi-*
          merge-multiple: true
          path: release-files/pypi
      - name: PyPI, the files not there yet
        id: pypi
        run: node tools/spectra/scripts/release.mjs pypi --index "https://pypi.org/simple/" --files release-files/pypi --upload release-upload/pypi
      - name: PyPI, their upload
        if: steps.pypi.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Trusted publishing, with PyPI's attestations.
          packages-dir: release-upload/pypi/

  npm:
    name: npm
    needs: draft
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
        with:
          install: false
      - name: npm 11.21.1, for trusted publishing
        run: npm install --global npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-*
          merge-multiple: true
          path: release-files/npm
      - uses: $/.github/actions/publish-npm
        with:
          registry: https://registry.npmjs.org/
          files: release-files/npm

  release:
    name: The release published
    needs: [pypi, npm]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
        with:
          install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release
          path: release-files/github
      - name: The draft published, which makes the tag
        run: node tools/spectra/scripts/release.mjs publish-draft --tag "v$VERSION" --files release-files/github
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The install check again, against npm, PyPI and GitHub themselves. A failed install is run
  # again, as a failed publishing job is.
  install-check-published:
    name: The install check, against the registries
    if: ${{ !inputs.dry-run }}
    needs: release
    uses: $/.github/workflows/install_check.yml
    with:
      stand-ins: false
