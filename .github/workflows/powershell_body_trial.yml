name: The PowerShell body trial

# What bytes a server receives from the skill's Windows block that posts a JSON body with curl.exe,
# run from Node through pipes as the skill's test and a coding agent's shell run it, in the block's
# own form and in variants, under Windows PowerShell and PowerShell 7. Started by hand; it
# publishes nothing.

on:
  workflow_dispatch:

permissions: {}

jobs:
  windows:
    name: The PowerShell body trial (windows-x64)
    runs-on: windows-latest
    steps:
      - name: The cases
        shell: bash
        run: |
          mkdir trial && cd trial
          cat > trial.mjs <<'EOF'
          import {spawnSync, spawn} from 'node:child_process';
          import {writeFileSync} from 'node:fs';

          if (process.argv[2] === 'server') {
            const {createServer} = await import('node:http');
            createServer((request, response) => {
              const chunks = [];
              request.on('data', chunk => chunks.push(chunk));
              request.on('end', () => {
                const body = Buffer.concat(chunks);
                response.end(JSON.stringify({text: body.toString('latin1'), hex: body.toString('hex')}));
              });
            }).listen(9899, '127.0.0.1', () => console.log('listening'));
          } else {
            const server = spawn(process.execPath, ['trial.mjs', 'server'], {stdio: ['ignore', 'pipe', 'inherit']});
            await new Promise(resolve => server.stdout.once('data', resolve));
            const url = 'http://127.0.0.1:9899/api';
            const blocks = {
              as_written: `'{"text": "Hello"}' | curl.exe -s -X POST ${url} -H 'content-type: application/json' -d '@-'`,
              data_binary: `'{"text": "Hello"}' | curl.exe -s -X POST ${url} -H 'content-type: application/json' --data-binary '@-'`,
              from_a_file: `'{"text": "Hello"}' | Set-Content -Encoding ascii body.json\ncurl.exe -s -X POST ${url} -H 'content-type: application/json' -d '@body.json'`,
              escaped_quotes: `curl.exe -s -X POST ${url} -H 'content-type: application/json' -d '{\\"text\\": \\"Hello\\"}'`,
              web_request: `(Invoke-WebRequest -UseBasicParsing -Method Post -Uri ${url} -ContentType 'application/json' -Body '{"text": "Hello"}').Content`,
            };
            const callers = {stdin_pipe: 'pipe', stdin_ignored: 'ignore'};
            const rows = [];
            for (const shell of ['powershell.exe', 'pwsh.exe']) {
              for (const [block, text] of Object.entries(blocks)) {
                for (const [caller, stdin] of Object.entries(callers)) {
                  writeFileSync('block.ps1', text);
                  const result = spawnSync(
                    shell,
                    ['-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', 'block.ps1'],
                    {stdio: [stdin, 'pipe', 'pipe'], encoding: 'utf8', timeout: 30_000},
                  );
                  let received = {};
                  try {
                    received = JSON.parse(result.stdout);
                  } catch {
                    received = {text: `not JSON: ${result.stdout.slice(0, 80)}`};
                  }
                  rows.push({
                    shell,
                    block,
                    caller,
                    returned: result.error ? String(result.error.code) : `exit ${result.status}`,
                    'body received': received.text,
                    hex: (received.hex ?? '').slice(0, 60),
                    stderr: (result.stderr ?? '').trim().slice(0, 120),
                  });
                }
              }
            }
            server.kill();
            console.table(rows);
            for (const row of rows) console.log(JSON.stringify(row));
          }
          EOF
          node trial.mjs
          where curl.exe || true
          curl.exe --version | head -1
