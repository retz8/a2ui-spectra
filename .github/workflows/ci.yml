name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Version check
        run: yarn workspace a2ui-spectra check:version
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync the Python workspace
        run: uv sync --all-packages --locked
      - name: Setup Wireit Cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4
      - name: Build
        run: yarn build:all
      - name: Lint
        run: yarn lint:all
      - name: Format check
        run: yarn format:check:all
      - name: Python format check
        run: uv run pyink --check .
      - name: Python type check
        run: uv run mypy
      - name: Python tests
        run: uv run pytest
      # The packs are checked here and not uploaded; the release workflow alone uploads them.
      - name: Pack the libraries
        run: yarn workspace a2ui-spectra pack:libraries
      - name: Check the libraries' packs, and install them
        run: yarn workspace a2ui-spectra check:libraries
      - name: Install Playwright's Chromium
        run: npx playwright@1.58.1 install --with-deps chromium chromium-headless-shell
      - name: Test
        run: yarn test:all

  binaries:
    uses: ./.github/workflows/binaries.yml

  binary-test:
    name: The binary test run (${{ matrix.platform }})
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync the Python workspace
        run: uv sync --all-packages --locked
      - name: Setup Wireit Cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4
      - name: Build
        run: yarn build:all
      - name: Install Playwright's Chromium
        run: npx playwright@1.58.1 install --with-deps chromium chromium-headless-shell
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a2ui-spectra-${{ matrix.platform }}
          path: ${{ runner.temp }}/binary
      - name: Make the binary executable
        run: chmod +x "$RUNNER_TEMP/binary/a2ui-spectra-${{ matrix.platform }}"
      - name: Test against the binary
        run: yarn workspace a2ui-spectra test
        env:
          SPECTRA_BINARY: ${{ runner.temp }}/binary/a2ui-spectra-${{ matrix.platform }}
          # The build comes from the cache; the tests run against this run's binary.
          WIREIT_CACHE: none

  windows:
    needs: binaries
    uses: ./.github/workflows/windows_binary_test.yml
