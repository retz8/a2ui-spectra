name: The binary test run on Windows x64

on:
  workflow_call:
    inputs:
      wireit-cache:
        description: Restore and save Wireit's outputs through the GitHub Actions cache
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    name: The binary test run (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync the Python workspace
        run: uv sync --all-packages --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a2ui-spectra-windows-x64.exe
          path: ${{ runner.temp }}/binary
      - name: Setup Wireit Cache
        if: inputs.wireit-cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4
      - name: Build
        run: yarn build:all
      # Without --with-deps, which on Windows installs the Media Foundation feature, for media playback no test uses.
      - name: Install Playwright's Chromium
        run: npx playwright@1.58.1 install chromium chromium-headless-shell
      - name: Test against the binary
        run: yarn workspace a2ui-spectra test
        env:
          SPECTRA_BINARY: ${{ runner.temp }}\binary\a2ui-spectra-windows-x64.exe
          # The build comes from the cache; the tests run against this run's binary.
          WIREIT_CACHE: none
