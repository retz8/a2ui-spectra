name: The binary test run on Windows x64

on:
  workflow_call:
    inputs:
      first-run:
        description: Measure the sub-task 10.2 spec's first-run points before the test run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: The binary test run (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Sync the Python workspace
        run: uv sync --all-packages --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a2ui-spectra-windows-x64.exe
          path: ${{ runner.temp }}/binary
      - name: The first run
        if: inputs.first-run
        timeout-minutes: 20
        continue-on-error: true
        run: |
          yarn workspace a2ui-spectra exec bun build --compile ../../_dev/tools/windows_first_run/probe.ts --outfile "$env:RUNNER_TEMP\probe\probe.exe"
          node _dev/tools/windows_first_run/driver.mjs
        env:
          PROBE_EXE: ${{ runner.temp }}\probe\probe.exe
          PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe
      - name: Setup Wireit Cache
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4
      - name: Build
        run: yarn build:all
      - name: Install Playwright's Chromium
        run: npx playwright@1.58.1 install --with-deps chromium chromium-headless-shell
      - name: Test against the binary
        continue-on-error: ${{ inputs.first-run }}
        run: yarn workspace a2ui-spectra test
        env:
          SPECTRA_BINARY: ${{ runner.temp }}\binary\a2ui-spectra-windows-x64.exe
          # The build comes from the cache; the tests run against this run's binary.
          WIREIT_CACHE: none
